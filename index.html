
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevConverter</title>

    <!-- CSS -->
    <link rel="stylesheet" href="./CSS/reset.css">
    <link rel="stylesheet" href="./CSS/header.css">
    <link rel="stylesheet" href="./CSS/footer.css">
    <link rel="stylesheet" href="./CSS/style.css">


    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Poppins:wght@500&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>$DevConverter</h1>
    </header>

    <main>
        <form id="form">

            <section class="inputs-container">

                <div class="form-group">
                    <label for="value-real">
                        Valor a ser convertido (R$)
                    </label>

                    <input
                        type="number"
                        placeholder="20.00"
                        id="value-real"
                        name="value-real"
                        min="0"
                        max="1000000"
                        step="0.01"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="currency">
                        Escolha a moeda
                    </label>

                    <select id="currency" name="currency" required>
                        <option value="">Selecione...</option>
                        <option value="eur">Euro (€)</option>
                        <option value="usd">Dólar americano (US$)</option>
                    </select>
                </div>

            </section>

            <button type="submit">Converter</button>

        </form>

        <h2 id="result"</h2>

    </main>

    <footer>
        <span>
            &copy; DevConverter, 2026. Todos os direitos reservados.
        </span>
    </footer>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
